services:
  database:
    image: postgres:17-alpine
    container_name: leasemanager_database
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: leasemanager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - leasemanager-network

  app:
    image: leasemanager:latest
    build: .
    restart: "no"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/leasemanager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345678
      JWT_SECRET: LeaseManagerSecretKeyForJwtTokenGenerationAndValidation2026
    networks:
      - leasemanager-network

volumes:
  database_data:

networks:
  leasemanager-network:
    driver: bridge